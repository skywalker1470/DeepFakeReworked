name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Write SSH key
        run: |
          install -m 600 -D /dev/null ~/.ssh/deploy_key
          echo "${{ secrets.VM_KEY }}" > ~/.ssh/deploy_key
          ssh-keyscan -H "$(echo '${{ secrets.VM_HOST }}' | cut -d@ -f2)" >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          REGISTRY: ${{ secrets.REGISTRY }}
          IMAGE_NAME: deepfake-detector
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_KEY: ~/.ssh/deploy_key
        run: ./deploy.sh
